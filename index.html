<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f7fb">
  <meta name="description" content="A simple Fahrenheit to Celsius temperature converter.">
  <title>Temperature Converter</title>
  <link rel="stylesheet" href="./static/style.css">
</head>
<body>
  <main class="page-shell">
    <section class="converter-card" aria-labelledby="page-title">
      <div class="eyebrow"><span class="thermometer" aria-hidden="true">°</span> QUICK CONVERSION</div>
      <h1 id="page-title">Temperature<br>converter</h1>
      <p class="intro">Convert Fahrenheit to Celsius in a snap.</p>

      <form id="converter-form" novalidate>
        <label for="fahrenheit">Temperature in Fahrenheit</label>
        <div class="input-row">
          <input type="number" id="fahrenheit" name="fahrenheit" placeholder="e.g. 72" step="any" inputmode="decimal" required>
          <span class="unit" aria-hidden="true">°F</span>
        </div>
        <button type="submit">Convert temperature <span aria-hidden="true">→</span></button>
      </form>

      <p class="result" id="result" role="status" aria-live="polite" hidden></p>
      <p class="formula">Formula: (°F − 32) × 5 ÷ 9</p>
    </section>
    <footer>Made for everyday conversions</footer>
  </main>
  <script>
    const form = document.getElementById('converter-form');
    const input = document.getElementById('fahrenheit');
    const result = document.getElementById('result');

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      const fahrenheit = input.value.trim();
      if (fahrenheit === '' || !Number.isFinite(Number(fahrenheit))) {
        result.textContent = 'Please enter a valid temperature.';
        result.className = 'result error';
        result.hidden = false;
        input.focus();
        return;
      }

      const celsius = (Number(fahrenheit) - 32) * 5 / 9;
      result.textContent = `${celsius.toFixed(2)} °C`;
      result.className = 'result';
      result.hidden = false;
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html>

<head>
    <title>Temperature Converter</title>
</head>

<body>

    <h1>Temperature Converter</h1>

    <form method="POST">
        <label>Fahrenheit:</label>
        <input type="number" name="fahrenheit" required>

        <button type="submit">Convert</button>
    </form>

    {% if result is not none %}
    <p>Celsius: {{ result }}</p>
    {% endif %}

</body>

</html>
